[package]
name = "route-macros-types"
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["Sunrisies <3266420686@qq.com>"]
description = "Shared types for route-macros: ApiResponse, EmptyResponse, HttpResult, PaginatedResp, etc."
repository = "https://github.com/Sunrisies/server"
keywords = ["actix-web", "crud", "openapi", "api-response"]
categories = ["web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["chrono"] }
actix-web = "4"
sea-orm = "1"
log = "0.4"
validator = "0.20"
